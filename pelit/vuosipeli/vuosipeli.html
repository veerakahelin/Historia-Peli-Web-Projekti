<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="vuosipeli.css">
    <script src="vuosipeli.js" defer></script>
</head>
<body>
    <h1>Mikä vuosi?</h1>
    <p id="score-sofar"></p>
    <div class="quiz">
        <h2 id="question">Berliinin muuri kaatuu</h2>
        <img id="question-image" src="" alt="Question image">
        <div class="answer">
            <label id="vuosi-label" for="vuosi">Vuosi:</label>
            <input type="text" id="vastaus" name="vastaus">
        </div>
        <p id="feedback"></p>
        <button id="next">Seuraava</button>
        <button id="back">Takaisin</button>
    </div>
</body>
</html>
