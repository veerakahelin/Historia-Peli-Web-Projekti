<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suomi Itsenäistyy!</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../tyylit/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light custom-navbar">
  <div class="container">
    
    <a class="navbar-brand logo" href="">HISTORIAPELI</a>

    <a id="takaisin" href="../../../etusivu/index.html">
      <button>Takaisin</button>
    </a>

  </div>
</nav>

<!-- HOME SCREEN -->
<div id="home" class="screen active">
  <section class="container hero mt-5">
    <div class="row align-items-center">

      <div class="col-md-6 pe-md-4 hero-text">
        <h1>TERVETULOA SUOMI ITSENÄISTYY PELIIN!</h1>
        <h2>MUUT PELIT LÖYDÄT "PELIT" VALIKOSTA</h2>

        <button class="btn btn-light mt-3 mb-4" onclick="startGame()">
          ALOITA PELI
        </button>
      </div>

      <div class="col-md-6 ps-md-4 text-center">
        <img src="../dokumentit/suomen itsenäistyminen.webp"
             class="hero-img img-fluid"
             alt="Suomen itsenäistyminen">
      </div>

    </div>
  </section>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen container hero mt-5">
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="score" class="mt-3"></p>
</div>

<!-- END SCREEN -->
<div id="end" class="screen container mt-5 text-center">
    <h2>PELI LOPPUI</h2>
    <p id="finalScore"></p>

    <button class="btn btn-dark" onclick="goHome()">
        Palaa etusivulle?
    </button>
</div>

</main>

<!-- FOOTER -->
<footer class="custom-footer mt-5">
  <div class="container footer-content">
    <div>
      OTA YHTEYTTÄ MEIHIN → 044746385
    </div>

    <div class="divider"></div>

    <div>
      SEURAA MEITÄ SOMESSA → HISTORIAPELI
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../java/script.js"></script>


</body>
</html>
