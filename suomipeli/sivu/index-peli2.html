<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">

<!-- NAVBAR -->
 
<nav class="navbar navbar-expand-lg navbar-light custom-navbar">
  <div class="container">
    
    <a class="navbar-brand logo" href="">HISTORIAPELI</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="nav">
      <ul class="navbar-nav menu w-100 d-flex">

        <li class="nav-item flex-fill">
          <a class="nav-link nav-btn w-100 text-center" href="#" onclick="goHome()">INFO</a>
        </li>

        <li class="nav-item flex-fill">
          <a class="nav-link nav-btn w-100 text-center" href="#" onclick="goHome()">ESITTELY</a>
        </li>

        <li class="nav-item flex-fill dropdown">
          <a class="nav-link nav-btn w-100 text-center dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"> PELIT </a>

          <ul class="dropdown-menu text-center w-100">
            <li><a class="dropdown-item" href="#" onclick="goHome()">HISTORIAPELI</a></li>
            <li><a class="dropdown-item" href="#">PELI 1</a></li>
            <li><a class="dropdown-item" href="#">PELI 2</a></li>
            <li><a class="dropdown-item" href="#">PELI 3</a></li>
          </ul>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- HOME SCREEN -->

<div id="home" class="screen active">

  <section class="container hero mt-5">
    <div class="row align-items-center">

      <div class="col-md-6 pe-md-4 hero-text">
        <h1>TERVETULOA SUOMI ITSENÄISTYY PELIIN!</h1>
        <h2>MUUT PELIT LÖYDÄT "PELIT" VALIKOSTA</h2>

        <button class="btn btn-light mt-3 mb-4" onclick="startGame()"> ALOITA PELI </button>
      </div>

      <div class="col-md-6 ps-md-4 text-center">
        <img src="../dokumentit/suomen itsenäistyminen.webp"
             class="hero-img img-fluid"
             alt="Suomen itsenäistyminen">
      </div>

    </div>
  </section>

</div>

<!-- GAME SCREEN -->

<div id="game" class="screen container hero mt-5">

    <h2 id="question"></h2>
    <div id="answers"></div>

    <p id="score" class="mt-3"></p>

</div>

<!-- END SCREEN -->

<div id="end" class="screen container mt-5 text-center">

    <h2>PELI LOPPUI</h2>
    <p id="finalScore"></p>

    <button class="btn btn-dark" onclick="goHome()">
        Palaa etusivulle?
    </button>

</div>

</main>

<!-- FOOTER -->
 
<footer class="custom-footer mt-5">
  <div class="container footer-content">

    <div>
      OTA YHTEYTTÄ MEIHIN → 044746385
    </div>

    <div class="divider"></div>

    <div>
      SEURAA MEITÄ SOMESSA → HISTORIAPELI
    </div>

  </div>
</footer>
